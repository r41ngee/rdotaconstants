[package]
name = "rdc-map"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode-next = { version = "3.2.0", optional = true, features = ["derive"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }

[features]
serde = ["dep:serde"]
bincode-next = ["dep:bincode-next"]
serde_json = ["serde", "dep:serde_json"]
