[package]
name = "rdc-map"
version = "0.1.0"
edition = "2024"
description = "Data container of KV type"
license = "MIT"
authors = ["ryoshin"]
repository = "https://github.com/r41ngee/rdotaconstants"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bincode-next = { version = "3.2.0", optional = true, features = ["derive"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }

[features]
serde = ["dep:serde"]
bincode-next = ["dep:bincode-next"]
serde_json = ["serde", "dep:serde_json"]
