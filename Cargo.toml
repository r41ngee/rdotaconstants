[package]
name = "rdotaconstants"
version = "0.3.6"
edition = "2024"
description = "Rust port of pydotaconstants — local Dota 2 hero, ability, item, and localization data with zero runtime dependencies."
license = "MIT"
repository = "https://github.com/r41ngee/rdotaconstants"
exclude = [
    ".github/",
    "pydotaconstants_commit.sha",
    "local_upd.sh",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
unstable = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
