[package]
name = "rdotaconstants"
version = "0.5.2"
rust-version = "1.85.1"
keywords = ["dota2", "localization", "heroes", "abilities"]
edition = "2024"
description = "Rust port of pydotaconstants — local Dota 2 hero, ability, item, and localization data with zero runtime dependencies."
license = "MIT"
authors = ["ryoshin"]
repository = "https://github.com/r41ngee/rdotaconstants"
exclude = [
    ".github/",
    "pydotaconstants_commit.sha",
    "local_upd.sh",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
unstable = []

[dependencies]
bincode = "2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "2"
serde_json = "1"
