name: check & update

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

concurrency:
    group: update-constants
    cancel-in-progress: false

jobs:
    check:
        name: check for pydotaconstants changes
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        outputs:
            proceed: ${{ steps.check.outputs.proceed }}
            latest: ${{ steps.check.outputs.latest }}
        steps:
            - uses: actions/checkout@v5
            - name: Check pydotaconstants for new commits
              id: check
              run: |
                set -euo pipefail
                latest=$(gh api 'repos/r41ngee/pydotaconstants/commits/main' \
                    | jq -r .sha)
                current=$(cat pydotaconstants_commit.sha 2>/dev/null || echo "")

                echo "latest=$latest" >> "$GITHUB_OUTPUT"
                if [[ "$latest" != "$current" ]]; then
                    echo "proceed=true" >> "$GITHUB_OUTPUT"
                    echo "pydotaconstants changed: $current -> $latest"
                else
                    echo "proceed=false" >> "$GITHUB_OUTPUT"
                    echo "No pydotaconstants changes since $current; nothing to do."
                fi

    update:
        name: update
        runs-on: ubuntu-latest
        needs: check
        outputs: 
            data_change: ${{ steps.update.outputs.data_change }}
        if: needs.check.outputs.proceed == 'true'
        steps:
            - uses: actions/checkout@v5
            - name: Download JSONs from pydotaconstants
              run: |
                    set -euo pipefail
                    mkdir -p src/data/

                    BASE="https://raw.githubusercontent.com/r41ngee/pydotaconstants/refs/heads/main/src/pydotaconstants/data/"

                    curl -sL -o src/data/abilities.json "$BASE/abilities.json"
                    curl -sL -o src/data/heroes.json "$BASE/heroes.json"
                    curl -sL -o src/data/items.json "$BASE/items.json"
                    curl -sL -o src/data/locals.json "$BASE/locals.json"

            - uses: actions-rust-lang/setup-rust-toolchain@v1
            - run: cargo t
            - name: Check data size
              run: |
                    set -euo pipefail
                    heroes=$(jq 'length' src/data/heroes.json)
                    items=$(jq 'length' src/data/items.json)
                    abilities=$(jq 'length' src/data/abilities.json)
                    echo "heroes=$heroes items=$items abilities=$abilities"
                    if (( heroes < 120 || items < 500 || abilities < 1000 )); then
                        echo "::error::Build output looks incomplete (heroes=$heroes items=$items abilities=$abilities)"
                        exit 1
                    fi
            - name: Commit and push if constants changed
              id: update
              env:
                  LATEST: ${{ needs.check.outputs.latest }}
              run: |
                    set -euo pipefail
                    git config user.name  'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                    echo "$LATEST" > pydotaconstants_commit.sha

                    if git diff --quiet src/data/; then
                        echo "No constant changes. Advancing pydotaconstants tracker only."
                        git add pydotaconstants_commit.sha
                        if ! git diff --quiet --cached -- pydotaconstants_commit.sha; then
                            git commit -m "chore: track pydotaconstants ${LATEST}"
                            git push
                        fi
                        echo "data_change=false" >> "$GITHUB_OUTPUT"
                    else
                        echo "Constants changed. Committing update."
                        cargo install cargo-bump
                        cargo bump patch
                        cargo c
                        git add -A
                        git commit -m "Update constants from pydotaconstants ${LATEST}"
                        git push
                        echo "data_change=true" >> "$GITHUB_OUTPUT"
                    fi

    publish:
        name: Publish to crates-io
        runs-on: ubuntu-latest
        needs: update
        if: needs.update.outputs.data_change == 'true'
        steps:
            - uses: actions/checkout@v5
            - uses: actions-rust-lang/setup-rust-toolchain@v1
            - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

    report:
        name: Report
        runs-on: ubuntu-latest
        needs: [check, update]
        if: always()
        steps:
            - name: Summarize
              run: |
                    if [ "${{ needs.check.outputs.proceed }}" != "true" ]; then
                        echo "## ✅ No updates needed" >> $GITHUB_STEP_SUMMARY
                        echo "" >> $GITHUB_STEP_SUMMARY
                        echo "d2vpkr is already at \`${{ needs.check.outputs.latest }}\`" >> $GITHUB_STEP_SUMMARY
                    elif [ "${{ needs.update.result }}" = "success" ]; then
                        echo "## 🔄 Constants updated" >> $GITHUB_STEP_SUMMARY
                        echo "" >> $GITHUB_STEP_SUMMARY
                        echo "Updated from d2vpkr \`${{ needs.check.outputs.latest }}\`" >> $GITHUB_STEP_SUMMARY
                    else
                        echo "## ❌ Update failed" >> $GITHUB_STEP_SUMMARY
                        echo "" >> $GITHUB_STEP_SUMMARY
                        echo "The update job finished with status: \`${{ needs.update.result }}\`" >> $GITHUB_STEP_SUMMARY
                        exit 1
                    fi
